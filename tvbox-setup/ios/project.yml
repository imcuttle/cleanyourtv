name: TVBox
options:
  bundleIdPrefix: com.moyuyc
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 3B5D6SJ9YU
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TVBox:
    type: application
    platform: iOS
    sources:
      - path: TVBox
      - path: ../config/vod-apps.json
        buildPhase: resources
      - path: ../config/live-cn-466.txt
        buildPhase: resources
      - path: ../config/live-cn-iptvorg.m3u
        buildPhase: resources
    info:
      path: TVBox/Info.plist
      properties:
        CFBundleDisplayName: TVBox
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moyuyc.tvbox
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
