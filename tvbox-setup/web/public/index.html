<style>
/* 访问令牌蒙层。html 的 data-auth 属性由服务端写：1 已登录（蒙层从头到尾不存在）、0 未登录（首帧就是登录框）；
   pending = 正在用浏览器里记住的令牌自动登录（只显示 logo，不闪登录框）。没有这个属性 = 离线缓存的页面，按 pending 处理。 */
#authMask{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:#141414;color:#fff;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s linear .2s}
html:not([data-auth="1"]) #authMask{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .15s ease}
html:not([data-auth="1"]) body>:not(#authMask){visibility:hidden}
#authMask .am-box{width:min(340px,86vw);text-align:center}
#authMask .am-logo{font-size:32px;font-weight:800;letter-spacing:1px;color:#e50914;margin-bottom:26px}
#authMask form{opacity:0;visibility:hidden;transition:opacity .15s ease}  /* 占着位置：pending → 登录框时 logo 不会跳 */
html[data-auth="0"] #authMask form{opacity:1;visibility:visible}
#authMask .am-hint{margin:0 0 12px;color:#ddd}
#authMask input{box-sizing:border-box;width:100%;height:44px;padding:0 14px;border-radius:8px;border:1px solid #ffffff40;background:#000a;color:#fff;font:inherit;font-size:16px;outline:none;text-align:center;letter-spacing:1px}
#authMask input:focus{border-color:#fff}
#authMask button{margin-top:12px;width:100%;height:44px;border:0;border-radius:8px;background:#e50914;color:#fff;font:inherit;font-size:16px;font-weight:700}
#authMask button:disabled,#authMask input:disabled{opacity:.6}
#authMask .msg{min-height:20px;margin-top:10px;color:#ff6b6d;font-size:13px}
#authMask .am-sub{margin:6px 0 0;color:#8a8a8a;font-size:12px}
</style>
<script>
/* 统一的接口拦截：/api /hls /img /dl /media 的 fetch 都经过这里。
   - 请求带上浏览器里记住的令牌（服务端据此种下 HttpOnly Cookie，之后 <img> / <video> 也自动通过）
   - 拿到 401：令牌失效，蒙层盖上，请求挂起；输入对了自动重发，页面不用刷新、业务代码不用管 */
(() => {
  'use strict';
  const KEY = 'tvbox_token', root = document.documentElement, rawFetch = window.fetch.bind(window);
  const store = {
    get() { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } },
    set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch {} }
  };

  let state = root.getAttribute('data-auth'), ready = Promise.resolve(), release = () => {}, epoch = 0;
  const wait = () => { ready = new Promise(r => { release = r; }); };
  const focusSoon = () => requestAnimationFrame(() => { const i = document.getElementById('authToken'); if (i) i.focus({ preventScroll: true }); });
  const set = s => { state = s; root.setAttribute('data-auth', s); if (s === '1') release(); else if (s === '0') focusSoon(); };
  const until = signal => new Promise((ok, no) => {
    const abort = () => no(new DOMException('Aborted', 'AbortError'));
    if (signal && signal.aborted) return abort();
    if (signal) signal.addEventListener('abort', abort, { once: true });
    ready.then(ok);
  });
  // GET /api/safety（已有的接口）当探针：200 = 令牌对
  async function verify(token) {
    try {
      const r = await rawFetch('/api/safety', { cache: 'no-store', headers: token ? { Authorization: 'Bearer ' + token } : {} });
      return r.ok ? 'ok' : r.status === 401 ? 'bad' : r.status === 429 ? 'limited' : 'offline';
    } catch { return 'offline'; }
  }

  if (state !== '1') {
    wait();
    if (state !== '0' || store.get()) {          // 不确定 / 有记住的令牌：先静默验证，不出登录框
      root.setAttribute('data-auth', state = 'pending');
      verify(store.get()).then(r => {
        if (r === 'ok' || r === 'offline') return set('1');   // offline：不是令牌的问题，让页面按原来的样子处理
        if (r === 'bad') store.set('');
        set('0');
      });
    }
    document.addEventListener('DOMContentLoaded', () => { if (state === '0') focusSoon(); });
  }

  const guarded = input => {
    try { const u = new URL(typeof input === 'string' ? input : input.url || String(input), location.href); return u.origin === location.origin && /^\/(api|hls|img|dl|media)\//.test(u.pathname); }
    catch { return false; }
  };
  window.fetch = async function (input, init) {
    if (!guarded(input)) return rawFetch(input, init);
    const signal = init && init.signal;
    for (;;) {
      while (state !== '1') await until(signal);
      const sent = epoch, t = store.get();
      let opts = init;
      if (t && typeof input === 'string') { const h = new Headers(init && init.headers); if (!h.has('Authorization')) h.set('Authorization', 'Bearer ' + t); opts = { ...init, headers: h }; }
      const r = await rawFetch(input, opts);
      if ((r.status !== 401 && r.status !== 429) || r.headers.get('X-Auth-Required') !== '1') return r;
      if (sent === epoch) { store.set(''); if (state === '1') { wait(); set('0'); } }   // 令牌失效（改过 / Cookie 被清）→ 蒙层
    }
  };

  document.addEventListener('submit', async e => {
    const f = e.target;
    if (!f || f.id !== 'authForm') return;
    e.preventDefault();
    const inp = f.elements.token, btn = f.querySelector('button'), msg = f.querySelector('.msg'), t = inp.value.trim();
    if (!t) return inp.focus();
    btn.disabled = inp.disabled = true; msg.textContent = '';
    const r = await verify(t);
    btn.disabled = inp.disabled = false;
    if (r === 'ok') { store.set(t); epoch++; inp.value = ''; set('1'); return; }
    msg.textContent = r === 'limited' ? '错误次数太多，请 1 分钟后再试' : r === 'offline' ? '连不上服务，稍后再试' : '令牌不对，再核对一下';
    inp.focus(); inp.select();
  });
})();
</script>
</head>
<body>
<div id="authMask" role="dialog" aria-modal="true" aria-label="访问验证">
  <div class="am-box">
    <div class="am-logo">TVBOX</div>
    <form id="authForm" autocomplete="on">
      <p class="am-hint">请输入访问令牌</p>
      <input id="authToken" name="token" type="password" autocomplete="current-password" placeholder="访问令牌" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go">
      <button type="submit">进入</button>
      <div class="msg" aria-live="polite"></div>
      <p class="am-sub">令牌在启动服务的窗口里，也存在服务端 web/.env 的 TVBOX_TOKEN</p>
    </form>
  </div>
</div>
<header id="top">
  <!-- Back / forward / reload: an installed (standalone) window has no browser toolbar. Shown only there on PC. -->
  <div class="hnav" id="hnav">
    <button id="navBack" type="button" title="后退 (Alt+←)" aria-label="后退" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="navFwd" type="button" title="前进 (Alt+→)" aria-label="前进" disabled><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="navReload" type="button" title="刷新 (F5)" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M19 8a8 8 0 1 0 1.5 6M19 3v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <a class="logo" href="#/">TVBOX<sup id="levelTag" class="level" hidden></sup></a>
  <nav>
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>首页</span></a>
    <a href="#/charts" data-nav="charts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V10h4v11zM10 21V3h4v18zM15 21v-7h4v7z"/></svg><span>榜单</span></a>
    <a href="#/live" data-nav="live"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 21h6M10 10l5 2.5-5 2.5z"/></svg><span>直播</span></a>
    <a href="#/favorites" data-nav="favorites"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21l-1.5-1.3C5.4 15.1 2 12 2 8.5A4.5 4.5 0 0 1 6.5 4c1.7 0 3.4.8 4.5 2.1C12.1 4.8 13.8 4 15.5 4A4.5 4.5 0 0 1 20 8.5c0 3.5-3.4 6.6-8.5 11.2z"/></svg><span>收藏</span></a>
    <a href="#/downloads" data-nav="downloads"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v9l3.5-3.5 1.4 1.4L12 16 6.1 9.9l1.4-1.4L11 12zM4 18h16v3H4z"/></svg><span>下载</span></a>
    <a href="#/settings" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg><span>设置</span></a>
  </nav>
  <div class="right">
    <form id="searchForm" class="search" role="search">
      <svg class="s-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><button type="button" class="s-clear" tabindex="-1" aria-label="清空"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 16A8 8 0 108 0a8 8 0 000 16zM5.2 4.1L8 6.9l2.8-2.8 1.1 1.1L9.1 8l2.8 2.8-1.1 1.1L8 9.1l-2.8 2.8-1.1-1.1L6.9 8 4.1 5.2z"/></svg></button>
      <input id="q" type="search" placeholder="搜片名 / 演员 / 导演" autocomplete="off" enterkeyhint="search">
      <button id="scopeBtn" class="scope" type="button" aria-haspopup="true" aria-expanded="false" title="搜索范围"><span id="scopeLabel">全部源</span><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="sHist" class="menu shist" hidden></div>
      <div id="scopeMenu" class="menu smenu" hidden>
        <div class="mhead">搜索范围</div>
        <button type="button" data-scope="all"><span class="so-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="so-t"><b>全部源</b><small id="scopeAllHint">同时搜索所有源</small></span><span class="so-ck">✓</span></button>
        <button type="button" data-scope="site"><span class="so-ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg></span><span class="so-t"><b>仅当前源</b><small id="scopeSiteHint">—</small></span><span class="so-ck">✓</span></button>
      </div>
    </form>
    <div class="picker">
      <button id="siteBtn" class="sitebtn" type="button"><span id="siteName">选择源</span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="siteMenu" class="menu" hidden></div>
    </div>
  </div>
</header>
<main id="view"></main>

<div id="sheetScrim" hidden></div>
<div id="sOv" hidden role="dialog" aria-label="搜索">
  <form id="sOvForm" class="sov-bar" role="search">
    <div class="sov-pill">
      <svg class="s-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><button type="button" class="s-clear" tabindex="-1" aria-label="清空"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 16A8 8 0 108 0a8 8 0 000 16zM5.2 4.1L8 6.9l2.8-2.8 1.1 1.1L9.1 8l2.8 2.8-1.1 1.1L8 9.1l-2.8 2.8-1.1-1.1L6.9 8 4.1 5.2z"/></svg></button>
      <input id="q2" type="search" autocomplete="off" enterkeyhint="search" placeholder="搜片名 / 演员 / 导演">
    </div>
    <button type="button" class="sov-cancel" id="sOvCancel">取消</button>
  </form>
  <div class="sov-body">
    <div class="sov-sec">搜索范围</div>
    <div class="sov-scope" id="sOvScope">
      <button type="button" data-scope="all"><b>全部源</b><small id="sOvAll">—</small></button>
      <button type="button" data-scope="site"><b>仅当前源</b><small id="sOvSite">—</small></button>
    </div>
    <div class="sov-sec"><span>最近搜索</span><button type="button" id="sOvClear" hidden>清空</button></div>
    <div id="sOvRecent" class="sov-recent"></div>
  </div>
</div>
<div id="player" hidden>
  <video id="video" playsinline autoplay></video>
  <div class="pbar">
    <button class="icon" data-act="close" title="返回 (Esc)" aria-label="返回"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="ptitle"></div>
    <span class="local" hidden>本地</span>
    <div class="pacts">
      <button class="pill" data-act="star" hidden title="收藏频道"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17.3l-5.8 3.4 1.5-6.6L2.6 9.6l6.7-.6L12 2.8l2.7 6.2 6.7.6-5.1 4.5 1.5 6.6z"/></svg><span class="l">收藏</span></button>
      <button class="pill" data-act="vfav" hidden title="收藏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5l-1.2-1.1C5.9 15 3 12.4 3 9a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 21 9c0 3.4-2.9 6-7.8 10.4z"/></svg><span class="l">收藏</span></button>
      <button class="pill" data-act="share" hidden title="分享链接"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.3 10.7l7.4-4.2M8.3 13.3l7.4 4.2"/></svg><span class="l">分享</span></button>
      <button class="pill" data-act="dl" hidden title="下载"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg><span class="l">下载</span></button>
      <button class="pill" data-act="ext" hidden title="用系统默认播放器打开这个文件"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span class="l">播放器</span></button>
      <button class="pill" data-act="pip" hidden title="小窗播放：切到别的应用也不会停"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM12 12h7v5h-7z"/></svg><span class="l">小窗</span></button>
      <button class="pill" data-act="prev" title="上一集"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 5L9 12l10 7z"/></svg><span class="l">上一集</span></button>
      <button class="pill" data-act="next" title="下一集"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7z"/></svg><span class="l">下一集</span></button>
      <button class="pill" data-act="list" title="选集"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h12M4 12h12M4 18h8M17 14l4 3-4 3z"/></svg><span class="l">选集</span></button>
      <button class="pill mo" data-act="rate" title="倍速"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a9 9 0 1 0 9 9M12 13l5-5"/></svg><span class="l">1x</span></button>
      <button class="pill mo" data-act="lock" title="锁定屏幕"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="l">锁定</span></button>
      <button class="pill mo" data-act="fs" title="全屏"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span class="l">全屏</span></button>
    </div>
  </div>
  <div class="pmsg"></div>
  <div class="pskip" hidden></div>
  <div class="phud" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path class="h-sun" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/><path class="h-vol" d="M4 9v6h4l5 5V4L8 9zM16 8.5a5 5 0 0 1 0 7"/></svg><div class="hbar"><i></i></div></div>
  <button class="plock" hidden aria-label="解锁"><svg viewBox="0 0 24 24"><path d="M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  <div class="pcenter">
    <button data-c="back" aria-label="后退 10 秒"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5">10</text></svg></button>
    <button data-c="play" aria-label="播放 / 暂停"><svg viewBox="0 0 24 24"><path class="i-play" d="M7 4.5v15l12-7.5z"/><path class="i-pause" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    <button data-c="fwd" aria-label="前进 10 秒"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5">10</text></svg></button>
  </div>
  <div class="ctrl">
    <div class="tlrow"><div class="tl"><div class="rail"><i class="buf"></i><i class="hov"></i><i class="played"></i></div><b class="knob"></b>
      <div class="tip" hidden><div class="frame"><video muted playsinline preload="auto"></video></div><span></span></div></div><span class="rem"></span></div>
    <div class="cbar">
      <button data-c="play" title="播放 / 暂停 (空格)"><svg viewBox="0 0 24 24"><path class="i-play" d="M7 4.5v15l12-7.5z"/><path class="i-pause" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
      <button data-c="back" title="后退 10 秒 (←)"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5">10</text></svg></button>
      <button data-c="fwd" title="前进 10 秒 (→)"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5">10</text></svg></button>
      <button data-c="mute" title="静音 (m)"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9z"/><path class="i-wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2"/><path class="i-x" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2"/></svg></button>
      <input class="vol" type="range" min="0" max="1" step="0.05" title="音量">
      <span class="time"></span>
